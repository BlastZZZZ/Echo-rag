[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoragv2-standalone"
version = "0.1.0"
description = "Standalone EchoRAGv2 strict pipeline bundle over HippoRAG v2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai==1.91.1",
  "litellm==1.73.1",
  "vllm==0.6.6.post1",
  "gritlm==1.0.2",
  "torch==2.5.1",
  "transformers==4.45.2",
  "networkx==3.4.2",
  "pydantic==2.10.4",
  "python_igraph==0.11.8",
  "tenacity==8.5.0",
  "tiktoken==0.7.0",
  "nest_asyncio",
  "numpy",
  "scipy",
  "tqdm",
  "einops",
  "boto3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
